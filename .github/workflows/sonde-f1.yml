# SONDE TEMPORAIRE (21/11) : format du calendrier F1 ESPN + OpenF1 pour le rappel 🔔 et le robot des tracés. À supprimer après lecture.
name: sonde-f1
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: |
          node -e "
          (async()=>{
            const j=await (await fetch('https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard?dates=2026')).json();
            const ab={};
            for(const e of (j.events||[])){ const l=(e.competitions||[]).map(c=>(c.type||{}).abbreviation).join(','); ab[l]=(ab[l]||[]).concat(e.name.slice(0,25)); }
            console.log('ABBR', JSON.stringify(ab));
            for(const e of (j.events||[])) console.log('EV', e.id, e.date.slice(0,10), JSON.stringify(e.circuit&&{id:e.circuit.id,n:e.circuit.fullName,c:e.circuit.address&&e.circuit.address.country}));
            const sp=(j.events||[]).find(e=>(e.competitions||[]).length>5)||{}; for(const c of (sp.competitions||[])) console.log('SPRINT', JSON.stringify({ty:c.type,date:c.date}));
            for (const u of ['sessions?session_key=latest','sessions?year=2025&session_name=Qualifying']) { const r=await fetch('https://api.openf1.org/v1/'+u); const t=await r.text(); console.log('OPENF1',u,r.status,t.slice(0,1500)); }
          })()"
