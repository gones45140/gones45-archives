# SONDE TEMPORAIRE (21/11) : format du calendrier F1 ESPN + OpenF1 pour le rappel 🔔 et le robot des tracés. À supprimer après lecture.
name: sonde-f1
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: |
          node -e "
          (async()=>{
            const j=await (await fetch('https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard?dates=2026')).json();
            const E=(j.events||[]).filter(e=>Date.parse(e.endDate||e.date)>Date.now()-3*864e5).slice(0,2);
            for(const e of E){ console.log('ESPN', e.id, e.name, e.date, e.endDate, '| circuit', JSON.stringify(e.circuit&&{id:e.circuit.id,fullName:e.circuit.fullName}));
              for(const c of (e.competitions||[])) console.log('   ', JSON.stringify({id:c.id,ty:c.type,date:c.date,st:c.status&&c.status.type&&c.status.type.name})); }
            for (const u of ['sessions?year=2026&meeting_key=latest','meetings?year=2025']) { const r=await fetch('https://api.openf1.org/v1/'+u); const t=await r.text(); console.log('OPENF1',u,r.status,t.slice(0,900)); }
          })()"
