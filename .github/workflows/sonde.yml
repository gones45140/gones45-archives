name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          node -e '
          (async()=>{const J=async u=>{try{const r=await fetch(u);return [r.status, r.ok?await r.json():null]}catch(e){return [0,null]}};
          for(const id of ["401584893","401703419","401810108"]){
            let [s1,a]=await J("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event="+id);
            console.log(id,"summary",s1,"pickcenter",JSON.stringify((a&&a.pickcenter||[]).map(p=>({p:p.provider&&p.provider.name,s:p.spread,d:p.details}))).slice(0,300),"odds",JSON.stringify((a&&a.odds)||null).slice(0,200));
            let [s2,b]=await J("https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/events/"+id+"/competitions/"+id+"/odds");
            console.log(id,"core odds",s2,"n=",b&&b.count,JSON.stringify((b&&b.items||[]).map(x=>({p:x.provider&&x.provider.name,s:x.spread,d:x.details,ou:x.overUnder}))).slice(0,400));
            let [s3,c]=await J("https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/events/"+id+"/competitions/"+id+"/predictor");
            console.log(id,"predictor",s3);
          }})()'
