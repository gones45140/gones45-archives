# 20261113j — sonde temporaire (codes ESPN des compétitions de sélections manquantes) ; à supprimer après usage.
name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > s.mjs <<'X'
          const L = ['uefa.euroq','conmebol.america','caf.nations','caf.nations_qual','fifa.worldq.conmebol','fifa.worldq.caf','fifa.worldq.afc','fifa.worldq.concacaf','fifa.worldq.ofc','concacaf.gold','concacaf.nations.league','afc.asian.cup','afc.asian','fifa.worldq.uefa','uefa.nations'];
          for (const lg of L) { const o = [];
            for (const y of [2022, 2023, 2024, 2025, 2026]) { let n = 0, fr = 0, st = '', ex = '', nom = '';
              for (let m = 1; m <= 12; m++) { const mm = String(m).padStart(2, '0');
                try { const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard?dates=${y}${mm}&limit=1000`, { headers: { 'User-Agent': 'Mozilla/5.0 (GONES45 archive)' } }); if (!r.ok) { st = r.status; continue; }
                  const j = await r.json(); const ev = j.events || []; n += ev.length; nom = nom || ((j.leagues || [])[0] || {}).name || '';
                  fr += ev.filter(e => JSON.stringify(e.competitions?.[0]?.competitors?.map(c => c.team?.id)).includes('"478"')).length; if (!ex && ev[0]) ex = ev[0].name;
                } catch (e) { st = 'err'; } }
              o.push(y + ':' + n + (fr ? '(FR' + fr + ')' : '') + (st ? '[' + st + ']' : '') + (y === 2024 ? ' «' + nom + '» ex=' + ex : '')); }
            console.log('SONDE', lg, o.join(' ')); }
          X
          node s.mjs
