name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          node -e '
          (async()=>{const J=async u=>{try{const r=await fetch(u);return [r.status, r.ok?await r.json():null]}catch(e){return [0,null]}};
          for(const [lg,id] of [["fra.1","677321"],["eng.1","637959"],["fra.1","746502"]]){
            let [s2,b]=await J("https://sports.core.api.espn.com/v2/sports/soccer/leagues/"+lg+"/events/"+id+"/competitions/"+id+"/odds");
            console.log(lg,id,"core odds",s2,"n=",b&&b.count,JSON.stringify((b&&b.items||[]).map(x=>({p:x.provider&&x.provider.name,s:x.spread,ou:x.overUnder,h:x.homeTeamOdds&&x.homeTeamOdds.moneyLine,a:x.awayTeamOdds&&x.awayTeamOdds.moneyLine,d:x.drawOdds&&x.drawOdds.moneyLine}))).slice(0,400));
            let [s3,p]=await J("https://sports.core.api.espn.com/v2/sports/soccer/leagues/"+lg+"/events/"+id+"/competitions/"+id+"/odds/100/propBets?limit=50");
            console.log(lg,id,"propBets",s3,(p&&p.count));
          }})()'
