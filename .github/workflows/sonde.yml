name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          node -e '
          const U=["https://site.api.espn.com/apis/site/v2/sports/rugby/270559/teams/25922/schedule?season=2025",
                   "https://site.api.espn.com/apis/site/v2/sports/rugby/270559/teams/25922/schedule?season=2024",
                   "https://site.api.espn.com/apis/site/v2/sports/rugby/270559/scoreboard?dates=20250610-20250705&seasontype=3&limit=400",
                   "https://site.api.espn.com/apis/site/v2/sports/rugby/270559/scoreboard?dates=20250610-20250705&limit=400",
                   "https://site.api.espn.com/apis/site/v2/sports/rugby-league/3/teams/289208/schedule?season=2025",
                   "https://site.api.espn.com/apis/site/v2/sports/rugby-league/3/scoreboard?dates=20250901-20251010&limit=400",
                   "https://sports.core.api.espn.com/v2/sports/rugby/leagues/270559/events/599792",
                   "https://sports.core.api.espn.com/v2/sports/rugby/leagues/270559/events/599780"];
          (async()=>{for(const u of U){try{const r=await fetch(u);const t=await r.text();console.log("\n== "+u+" -> "+r.status);let j;try{j=JSON.parse(t)}catch(e){console.log(t.slice(0,200));continue}
            if(j.events){console.log("n="+j.events.length);j.events.slice(-8).forEach(e=>console.log(e.id,e.date,e.name&&e.name.slice(0,40),JSON.stringify(e.seasonType||e.season),JSON.stringify((e.week||{})),(e.competitions&&e.competitions[0]&&JSON.stringify(e.competitions[0].type))||""))}
            else {console.log(JSON.stringify({season:j.season,seasonType:j.seasonType,week:j.week,competitions:(j.competitions||[]).map(c=>({type:c.type,note:c.notes,round:c.round}))}).slice(0,800))}}catch(e){console.log(u,e.message)}}})()'
