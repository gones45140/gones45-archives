# 20261113l — sonde temporaire (photos ESPN des joueurs de rugby) ; à supprimer après usage.
name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in 220673 245267 301864; do for u in "https://a.espncdn.com/i/headshots/rugby/players/full/$id.png" "https://a.espncdn.com/combiner/i?img=/i/headshots/rugby/players/full/$id.png&w=88&h=88"; do echo "PH $id $(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$u") $u"; done; done
          curl -s "https://site.web.api.espn.com/apis/common/v3/sports/rugby/athletes/220673" -A "Mozilla/5.0" | head -c 600; echo
