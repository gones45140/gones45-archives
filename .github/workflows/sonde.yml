name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > s.mjs <<'JS'
          const r=await fetch('https://www.lnr.fr/mentions-legales',{headers:{'User-Agent':'Mozilla/5.0 (GONES45 archive)'}}); const t=(await r.text()).replace(/<script[\s\S]*?<\/script>/g,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ');
          const i=t.indexOf('CONDITIONS GENERALES'); const c=t.slice(i);
          const hits=[...c.matchAll(/[^.]{0,300}(extraction|extraire|aspir|robot|automatis|réutilis|reproduction|propriété intellectuelle|base de données|données)[^.]{0,300}\./gi)].map(m=>m[0]);
          console.log('longueur CGU',c.length); hits.slice(0,12).forEach(h=>console.log('»',h.trim()));
          JS
          node s.mjs
