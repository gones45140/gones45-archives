# 20261113k — sonde temporaire (rugby : codes ESPN des matchs internationaux) ; à supprimer après usage.
name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > s.mjs <<'X'
          const H = { headers: { 'User-Agent': 'Mozilla/5.0 (GONES45 archive)' } };
          const J = async (u) => { try { const r = await fetch(u, H); return r.ok ? await r.json() : { _st: r.status }; } catch (e) { return { _st: 'err' }; } };
          for (const u of ['https://site.api.espn.com/apis/site/v2/sports/rugby/scoreboard?dates=20261113', 'https://site.web.api.espn.com/apis/v2/scoreboard/header?sport=rugby&dates=20261113', 'https://site.api.espn.com/apis/site/v2/sports/rugby/289234/scoreboard?dates=20261113']) {
            const j = await J(u); console.log('URL', u, j._st || '');
            const t = JSON.stringify(j); const m = t.match(/"(id|uid|slug)":"[^"]*"/g) || []; console.log('  ids', [...new Set(m)].slice(0, 40).join(' '));
            (j.events || []).forEach((e) => console.log('  EV', e.id, e.name, JSON.stringify(e.season || {}), (e.links || []).map((l) => l.href).slice(0, 2).join(' ')));
            JSON.stringify(j, (k, v) => { if (v && v.name && /Nations Championship/i.test(v.name)) console.log('  NC', JSON.stringify(v).slice(0, 300)); return v; }); }
          for (const id of ['289234', '24400', '298112', '299999']) { const j = await J(`https://site.api.espn.com/apis/site/v2/sports/rugby/${id}/scoreboard?dates=202611`); console.log('SB', id, j._st || '', ((j.leagues || [])[0] || {}).name, (j.events || []).filter((e) => /France/.test(e.name)).map((e) => e.id + ' ' + e.name + ' ' + e.date).join(' | ')); }
          X
          node s.mjs
