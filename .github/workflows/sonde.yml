name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > s.mjs <<'JS'
          const J=async u=>{try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}};
          for(const [sp,lg,d] of [['rugby','270559','202401'],['rugby','180659','202402'],['rugby-league','3','202409']]){
            const sb=await J('https://site.api.espn.com/apis/site/v2/sports/'+sp+'/'+lg+'/scoreboard?dates='+d);
            const e=(sb&&sb.events||[]).find(x=>x.status&&x.status.type&&x.status.type.completed); if(!e){console.log(lg,'aucun match');continue;}
            const sm=await J('https://site.api.espn.com/apis/site/v2/sports/'+sp+'/'+lg+'/summary?event='+e.id);
            const p=(((sm&&sm.rosters)||[])[0]||{}).roster||[];
            console.log(lg,e.name,'stats noms :',(p[0]&&p[0].stats||[]).map(s=>s.name).join(','));
            const top=p.map(x=>[x.athlete&&x.athlete.displayName,((x.stats||[]).find(s=>/^tries$/i.test(s.name))||{}).value]).filter(x=>x[1]>0);
            console.log(lg,'marqueurs d essais',JSON.stringify(top).slice(0,300));
          }
          JS
          node s.mjs
