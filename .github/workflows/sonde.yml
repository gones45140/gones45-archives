# 20261113k — sonde temporaire (rugby : codes ESPN des matchs internationaux) ; à supprimer après usage.
name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > s.mjs <<'X'
          const H = { headers: { 'User-Agent': 'Mozilla/5.0 (GONES45 archive)' } };
          const J = async (u) => { try { const r = await fetch(u, H); return r.ok ? await r.json() : { _st: r.status }; } catch (e) { return { _st: 'err' }; } };
          for (const id of ['17567', '289234', '164205', '180659']) { const o = []; let nom = '';
            for (const y of [2022, 2023, 2024, 2025, 2026]) { let n = 0, fr = 0;
              for (let m = 1; m <= 12; m++) { const j = await J(`https://site.api.espn.com/apis/site/v2/sports/rugby/${id}/scoreboard?dates=${y}${String(m).padStart(2, '0')}&limit=500`);
                if (j._st) continue; const ev = j.events || []; n += ev.length; fr += ev.filter((e) => /France/.test(e.name || '')).length; nom = nom || ((j.leagues || [])[0] || {}).name || ''; }
              o.push(y + ':' + n + (fr ? '(FR' + fr + ')' : '')); }
            console.log('SB', id, nom, o.join(' ')); }
          for (const [lg, ev] of [['17567', '603999']]) { const j = await J(`https://site.api.espn.com/apis/site/v2/sports/rugby/${lg}/summary?event=${ev}`);
            const r = (j.rosters || [])[0] || {}; const p = (r.roster || [])[0] || {};
            console.log('SUM', lg, ev, j._st || '', 'rosters=' + (j.rosters || []).length, 'joueurs=' + (r.roster || []).length, JSON.stringify(p).slice(0, 500)); }
          X
          node s.mjs
