name: sonde-titulaires
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sonde-titulaires.yml']
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          node -e '
          (async()=>{
            const j=u=>fetch(u).then(r=>r.json());
            for (const dt of ["20261125","20261126"]) {
              const s=await j("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates="+dt);
              for (const e of (s.events||[])) {
                if(!/Philadelphia|Miami/.test(e.name) && dt==="20261125") continue;
                const d=await j("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event="+e.id);
                console.log("== "+dt+" "+e.id+" "+e.name+" "+e.status.type.name+" | clés: "+Object.keys(d).join(","));
                const o=[];(d.boxscore?.players||[]).forEach(t=>(t.statistics||[]).forEach(g=>(g.athletes||[]).forEach(a=>o.push(t.team.abbreviation+" "+a.athlete.displayName+" starter="+a.starter+" dnp="+a.didNotPlay))));
                console.log("boxscore:",o.length, o.slice(0,14).join(" | "));
                const r=d.rosters||[];console.log("rosters:",r.length, JSON.stringify(r[0]||{}).slice(0,400));
                const inj=d.injuries||[];console.log("injuries:",JSON.stringify(inj).slice(0,200));
                if (dt==="20261126") break;
              }
            }
          })()'
