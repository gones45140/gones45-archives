# SONDE TEMPORAIRE (21/11) : bet45.fr en http / https. À supprimer après lecture.
name: sonde-https
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in http://bet45.fr https://bet45.fr http://www.bet45.fr https://www.bet45.fr; do echo "== $u"; curl -sI -m 15 "$u" | grep -iE "^HTTP|^location|^server" || echo "ECHEC $?"; done
          echo "== DNS"; dig +short bet45.fr A; dig +short bet45.fr AAAA; dig +short www.bet45.fr CNAME; dig +short bet45.fr CAA
          echo "== certificat"; echo | openssl s_client -connect bet45.fr:443 -servername bet45.fr 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>&1 | head -5
